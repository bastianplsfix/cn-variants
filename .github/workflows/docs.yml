name: Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/playground/**"
      - "apps/shadow-demo/**"
      - "packages/ui/**"
      - "src/**"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/ui-smoke.mjs"
      - "scripts/shadow-smoke.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/playground/**"
      - "apps/shadow-demo/**"
      - "packages/ui/**"
      - "src/**"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/ui-smoke.mjs"
      - "scripts/shadow-smoke.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          version: 0.2.5
          node-version: 24
          cache: true

      - run: vp install --frozen-lockfile --ignore-scripts

      - run: vp exec playwright install --with-deps chromium

      - run: vp run test:ui

      - run: vp run demo:shadow:test

      - run: vp run docs-check

      - run: vp run docs-build
        env:
          PLAYGROUND_BASE: /

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/playground/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
